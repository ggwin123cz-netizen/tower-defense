# Keeps the free Render server awake so the first multiplayer connection is fast.
# Render's free plan puts a service to sleep after 15 minutes without traffic.
# GitHub only runs scheduled workflows from the default branch, and may delay a run by a few minutes.
# To turn it off: disable the workflow in the Actions tab, or delete this file.
name: Keep multiplayer server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the server
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://tower-defense1.onrender.com/healthz
